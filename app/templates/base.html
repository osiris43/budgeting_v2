<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Budgeting{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="mx-auto max-w-5xl px-6 py-10">
      <header class="mb-10 flex items-center justify-between">
        <div class="text-xl font-semibold tracking-tight">Budgeting</div>
        <nav class="text-sm text-slate-300">
          <a class="hover:text-white" href="/">Home</a>
          <span class="px-2 text-slate-700">/</span>
          <a class="hover:text-white" href="/accounts">Accounts</a>
          <span class="px-2 text-slate-700">/</span>
          <a class="hover:text-white" href="/categories">Categories</a>
          <span class="px-2 text-slate-700">/</span>
          <a class="hover:text-white" href="/imports">Imports</a>
          <span class="px-2 text-slate-700">/</span>
          <a class="hover:text-white" href="/rules">Rules</a>
          <span class="px-2 text-slate-700">/</span>
          <a class="hover:text-white" href="/analysis/spend">Analysis</a>
        </nav>
      </header>

      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
